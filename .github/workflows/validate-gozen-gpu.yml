name: Validate existing GoZen GPU DLL on Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-gozen-gpu.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: gozen-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Reuse successful build artifact from run 45487138157
        uses: actions/download-artifact@v4
        with:
          name: GoZen-GPU-Candidate-NOT-VALIDATED
          path: candidate
          run-id: 45487138157
          github-token: ${{ github.token }}
      - name: Download official Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath editor
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
      - name: Test startup, extension loading, software and GPU-first decode separately
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = (Get-ChildItem editor -Recurse -File -Filter 'Godot_v4.7.2-stable_win64.exe' | Select-Object -First 1).FullName
          if (-not $engine) { throw 'Godot executable missing' }
          $project = Join-Path $PWD 'smoke'
          $diag = Join-Path $PWD 'diagnostics'
          New-Item -ItemType Directory -Path "$project/.godot" -Force | Out-Null
          Copy-Item candidate/libgozen.windows.template_release.x86_64.dll $project
          Copy-Item candidate/test.mp4 $project
          @'
          config_version=5
          [application]
          config/name="GoZen diagnostic"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          '@ | Set-Content "$project/project.godot" -Encoding utf8NoBOM
          @'
          [configuration]
          entry_symbol = "gozen_library_init"
          compatibility_minimum = "4.3"
          [libraries]
          windows.x86_64 = "res://libgozen.windows.template_release.x86_64.dll"
          '@ | Set-Content "$project/gozen.gdextension" -Encoding utf8NoBOM
          @'
          extends SceneTree
          func _initialize():
              call_deferred("run_test")
          func mark(message: String):
              print(message)
              var f = FileAccess.open("res://progress.txt", FileAccess.READ_WRITE if FileAccess.file_exists("res://progress.txt") else FileAccess.WRITE)
              if f:
                  f.seek_end()
                  f.store_line(message)
                  f.flush()
          func run_test():
              mark("SCRIPT_STARTED")
              var stage = OS.get_environment("GOZEN_SMOKE_STAGE")
              if stage == "startup":
                  mark("GOZEN_SMOKE_PASS")
                  quit(0)
                  return
              mark("LOADING_EXTENSION")
              if not ClassDB.class_exists("GoZenVideo"):
                  var status = GDExtensionManager.load_extension("res://gozen.gdextension")
                  mark("EXTENSION_LOAD_STATUS=" + str(status))
              if not ClassDB.class_exists("GoZenVideo"):
                  mark("EXTENSION_NOT_REGISTERED")
                  quit(1)
                  return
              mark("EXTENSION_REGISTERED")
              if stage == "load":
                  mark("GOZEN_SMOKE_PASS")
                  quit(0)
                  return
              var v = ClassDB.instantiate("GoZenVideo")
              mark("INSTANCE_CREATED")
              v.open("res://test.mp4")
              mark("OPEN_RETURNED")
              if not v.is_open():
                  quit(2)
                  return
              for i in range(12):
                  if not v.next_frame(false):
                      mark("FRAME_FAILED=" + str(i))
                      quit(3)
                      return
                  mark("FRAME_OK=" + str(i))
              var image = v.get_y_data()
              if image == null or image.get_width() != 320 or image.get_height() != 240:
                  mark("IMAGE_INVALID")
                  quit(4)
                  return
              v.close()
              mark("GOZEN_SMOKE_PASS")
              quit(0)
          '@ | Set-Content "$project/smoke.gd" -Encoding utf8NoBOM
          $failed = @()
          foreach ($stage in @('startup','load','software','gpu-first')) {
              Write-Host "===== START $stage ====="
              Remove-Item "$project/progress.txt" -ErrorAction SilentlyContinue
              $env:GOZEN_SMOKE_STAGE = $stage
              $env:GOZEN_HWDEC = if ($stage -eq 'gpu-first') { '1' } else { '0' }
              if ($stage -eq 'startup') {
                  Remove-Item "$project/.godot/extension_list.cfg" -ErrorAction SilentlyContinue
              } else {
                  'res://gozen.gdextension' | Set-Content "$project/.godot/extension_list.cfg" -Encoding utf8NoBOM
              }
              $stdout = Join-Path $diag "$stage.stdout.txt"
              $stderr = Join-Path $diag "$stage.stderr.txt"
              $log = Join-Path $diag "$stage.godot.log"
              $arguments = "--headless --verbose --path `"$project`" --log-file `"$log`" --script res://smoke.gd"
              $p = Start-Process -FilePath $engine -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $finished = $p.WaitForExit(60000)
              if (-not $finished) {
                  Write-Host "TIMEOUT: $stage"
                  $p.Kill()
                  [void]$p.WaitForExit(10000)
              }
              foreach ($file in @($stdout,$stderr,$log,"$project/progress.txt")) {
                  if (Test-Path $file) { Get-Content $file -Tail 120 }
              }
              $progress = "$project/progress.txt"
              $passed = $finished -and ($p.ExitCode -eq 0) -and (Test-Path $progress) -and (Select-String -Path $progress -SimpleMatch 'GOZEN_SMOKE_PASS' -Quiet)
              if (Test-Path $progress) { Copy-Item $progress "$diag/$stage.progress.txt" }
              if (-not $passed) { $failed += $stage }
              Write-Host "===== END $stage PASS=$passed ====="
          }
          if ($failed.Count -gt 0) { throw "Failed stages: $($failed -join ', ')" }
          Write-Host 'All smoke tests passed; physical GPU support still requires local test.'
      - name: Upload diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-Windows-Diagnostic-Logs
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish smoke-tested candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-GPU-First-Windows-x64-smoke-tested
          path: candidate/
          if-no-files-found: error
          retention-days: 30
