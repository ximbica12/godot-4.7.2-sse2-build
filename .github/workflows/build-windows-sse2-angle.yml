name: Build Godot 4.7.2 Windows x64 SSE2 ANGLE D3D11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-sse2-angle.yml"

permissions:
  contents: read

jobs:
  build:
    name: MinGW-w64 x64 SSE2 + ANGLE (D3D11)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Checkout Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot
          fetch-depth: 1

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            python3 \
            python3-venv \
            curl \
            unzip

      - name: Install ANGLE static libraries for MinGW x86_64
        run: |
          set -euo pipefail
          mkdir -p godot/bin/build_deps/angle-x86_64-gcc
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-angle-static/releases/download/chromium/7219/godot-angle-static-x86_64-gcc-release.zip" \
            --output "$RUNNER_TEMP/godot-angle-static-x86_64-gcc-release.zip"
          unzip -q "$RUNNER_TEMP/godot-angle-static-x86_64-gcc-release.zip" \
            -d godot/bin/build_deps/angle-x86_64-gcc
          echo "ANGLE libraries installed:"
          angle_dir="godot/bin/build_deps/angle-x86_64-gcc"
          find "$angle_dir" -type f -print
          # The archive may place import libraries in a nested directory,
          # while Godot's MinGW linker configuration searches angle_dir itself.
          while IFS= read -r -d '' lib; do
            if [ "$(dirname "$lib")" != "$angle_dir" ]; then
              cp -f "$lib" "$angle_dir/"
            fi
          done < <(find "$angle_dir" -type f \\( -name 'libEGL.windows.x86_64.a' -o -name 'libGLES.windows.x86_64.a' -o -name 'libANGLE.windows.x86_64.a' \\) -print0)
          test -f "$angle_dir/libEGL.windows.x86_64.a"
          test -f "$angle_dir/libGLES.windows.x86_64.a"
          test -f "$angle_dir/libANGLE.windows.x86_64.a"
          echo "All three ANGLE import libraries are in the exact linker search directory."

      - name: Install SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons-venv"
          "$RUNNER_TEMP/scons-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/scons-venv/bin/python" -m pip install "scons==4.10.1"

      - name: Patch Godot to use the SSE2 baseline
        run: python3 scripts/patch_sse2.py godot/SConstruct godot/platform/windows/SCsub

      - name: Build Windows x64 release runtime with ANGLE D3D11
        env:
          MINGW_PREFIX: /usr
        run: |
          cd godot
          "$RUNNER_TEMP/scons-venv/bin/scons" -j2 \
            platform=windows \
            arch=x86_64 \
            target=template_release \
            use_mingw=yes \
            use_llvm=no \
            use_static_cpp=yes \
            production=yes \
            lto=none \
            optimize=speed \
            disable_path_overrides=no \
            winrt=no \
            accesskit=no \
            d3d12=no \
            angle=yes \
            angle_libs=bin/build_deps/angle \
            vulkan=yes \
            opengl3=yes

      - name: Verify executable, ANGLE backend and CPU instruction set
        run: |
          set -euo pipefail
          exe="godot/bin/godot.windows.template_release.x86_64.exe"
          test -f "$exe"
          mkdir -p dist
          x86_64-w64-mingw32-objdump -f "$exe" | tee dist/PE_INFO.txt
          grep -q "pei-x86-64" dist/PE_INFO.txt
          python3 scripts/audit_sse2.py "$exe"
          strings "$exe" | grep -Fq "Could not initialize ANGLE OpenGL."
          strings "$exe" | grep -Fq "opengl3_angle"
          echo "ANGLE D3D11 backend markers found."

      - name: Package build information
        run: |
          set -euo pipefail
          cp godot/bin/godot.windows.template_release.x86_64.exe \
            dist/Godot_v4.7.2-stable_windows_x86_64_SSE2_ANGLE_D3D11.exe
          {
            echo "Godot tag: 4.7.2-stable"
            echo "Godot source commit: $(git -C godot rev-parse HEAD)"
            echo "Target: Windows x86_64 template_release"
            echo "CPU baseline: x86-64-v1 (SSE2)"
            echo "Compatibility renderer backend: ANGLE / Direct3D 11"
            echo "Compiler:"
            x86_64-w64-mingw32-g++ --version | head -n 1
            echo "SCons:"
            "$RUNNER_TEMP/scons-venv/bin/scons" --version | head -n 1
            echo "LTO: none"
            echo "C++ runtime: statically linked"
          } > dist/BUILD_INFO.txt

      - name: Upload Windows x64 SSE2 ANGLE D3D11 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Godot-4.7.2-Windows-x64-SSE2-ANGLE-D3D11
          path: dist/
          if-no-files-found: error
          retention-days: 30
