name: Build Godot 4.5.1 Windows x64 SSE2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-4.5.1-sse2.yml"
      - "scripts/patch_sse2_451.py"
      - "scripts/audit_x86_64_v1.py"
      - "scripts/test_audit_x86_64_v1.py"

permissions:
  contents: read

concurrency:
  group: godot-451-sse2-main
  cancel-in-progress: false

jobs:
  build:
    name: MinGW-w64 x86-64-v1 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Checkout official Godot 4.5.1 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.5.1-stable
          path: godot
          fetch-depth: 1

      - name: Validate scripts and audit regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_sse2_451.py scripts/audit_x86_64_v1.py scripts/test_audit_x86_64_v1.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Install MinGW-w64 toolchain and ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            ccache \
            python3 \
            python3-venv

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: godot-4.5.1-mingw-x86_64-${{ runner.os }}-${{ hashFiles('scripts/patch_sse2_451.py') }}
          restore-keys: |
            godot-4.5.1-mingw-x86_64-${{ runner.os }}-

      - name: Configure ccache compiler launchers
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ccache-wrappers"
          cat > "$RUNNER_TEMP/ccache-wrappers/x86_64-w64-mingw32-gcc" <<'EOF'
          #!/usr/bin/env bash
          for arg in "$@"; do
            case "$arg" in
              *.S|*.s) exec /usr/bin/x86_64-w64-mingw32-gcc "$@" ;;
            esac
          done
          exec ccache /usr/bin/x86_64-w64-mingw32-gcc "$@"
          EOF
          cat > "$RUNNER_TEMP/ccache-wrappers/x86_64-w64-mingw32-g++" <<'EOF'
          #!/usr/bin/env bash
          exec ccache /usr/bin/x86_64-w64-mingw32-g++ "$@"
          EOF
          chmod +x "$RUNNER_TEMP/ccache-wrappers/"*
          echo "$RUNNER_TEMP/ccache-wrappers" >> "$GITHUB_PATH"
          ccache --max-size=3G
          ccache --show-config

      - name: Verify compiler feature baseline before full build
        run: |
          set -euo pipefail
          /usr/bin/x86_64-w64-mingw32-gcc -Q --help=target \
            -march=x86-64 -mtune=generic \
            -mno-bmi -mno-bmi2 -mno-lzcnt -mno-popcnt \
            > "$RUNNER_TEMP/x86-target-features.txt"
          python3 - "$RUNNER_TEMP/x86-target-features.txt" <<'PY'
          import re
          import sys
          text = open(sys.argv[1], encoding="utf-8").read()
          for option in ("-mbmi", "-mbmi2", "-mlzcnt", "-mpopcnt"):
              match = re.search(r"^\s*" + re.escape(option) + r"\s+\[(enabled|disabled)\]", text, re.M)
              if not match or match.group(1) != "disabled":
                  raise SystemExit(f"Compiler did not confirm {option} disabled.")
              print(f"PASS: {option} disabled")
          PY

      - name: Install pinned SCons
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons-venv"
          "$RUNNER_TEMP/scons-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/scons-venv/bin/python" -m pip install "scons==4.10.1"

      - name: Patch Godot 4.5.1 for SSE2 baseline
        run: |
          set -euo pipefail
          python3 scripts/patch_sse2_451.py godot/SConstruct godot/platform/windows/SCsub godot/thirdparty/zstd/common/portability_macros.h
          git -C godot diff --check
          git -C godot diff -- SConstruct platform/windows/SCsub thirdparty/zstd/common/portability_macros.h | tee "$RUNNER_TEMP/godot-sse2.patch"

      - name: Build Windows x64 release runtime
        id: build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          unset MINGW_PREFIX
          ccache --zero-stats
          mkdir -p dist
          cd godot
          "$RUNNER_TEMP/scons-venv/bin/scons" -j2 \
            platform=windows \
            arch=x86_64 \
            target=template_release \
            use_mingw=yes \
            use_llvm=no \
            use_static_cpp=yes \
            production=yes \
            lto=none \
            optimize=speed \
            accesskit=no \
            d3d12=no \
            vulkan=yes \
            opengl3=yes
          ccache --show-stats | tee ../dist/CCACHE_STATS.txt

      - name: Verify PE architecture and SSE4.2 startup gate
        id: pe_check
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          exe="godot/bin/godot.windows.template_release.x86_64.exe"
          test -s "$exe"
          mkdir -p dist
          x86_64-w64-mingw32-objdump -f "$exe" | tee dist/PE_INFO.txt
          grep -q "pei-x86-64" dist/PE_INFO.txt
          if strings "$exe" | grep -Fq "A CPU with SSE4.2 instruction set support is required."; then
            echo "SSE4.2 startup gate unexpectedly remains in the binary."
            exit 1
          fi

      - name: Audit object files and final executable
        id: isa_audit
        if: always() && steps.build.outcome == 'success' && steps.pe_check.outcome == 'success'
        run: |
          set -uo pipefail
          mkdir -p dist
          set +e
          python3 scripts/audit_x86_64_v1.py \
            godot/bin/godot.windows.template_release.x86_64.exe \
            --source godot \
            --objects godot/bin/obj 2>&1 | tee dist/ISA_AUDIT.txt
          audit_status=${PIPESTATUS[0]}
          set -e
          if [[ "$audit_status" -eq 0 ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "ISA audit passed."
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "ISA audit failed with exit code $audit_status; candidate will be retained for diagnosis."
          fi

      - name: Package build candidate and diagnostics
        id: package_candidate
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          exe="godot/bin/godot.windows.template_release.x86_64.exe"
          test -s "$exe"
          mkdir -p dist
          cp "$exe" dist/Godot_v4.5.1-stable_windows_x86_64_SSE2.exe
          test -f dist/PE_INFO.txt || echo "PE verification did not complete." > dist/PE_INFO.txt
          test -f dist/ISA_AUDIT.txt || echo "ISA audit did not run." > dist/ISA_AUDIT.txt
          {
            echo "Godot tag: 4.5.1-stable"
            echo "Godot source commit: $(git -C godot rev-parse HEAD)"
            echo "Target: Windows x86_64 template_release"
            echo "CPU baseline: x86-64-v1 (SSE2)"
            echo "Compiler flags: -march=x86-64 -mtune=generic -mno-bmi -mno-bmi2 -mno-lzcnt -mno-popcnt"
            echo "Windows SSE4.2 startup shim: removed"
            echo "Zstd dynamic BMI1/BMI2 path and x86 assembly: disabled"
            echo "Mbed TLS AES-NI/PCLMUL: retained only behind CPUID dispatch"
            echo "HarfBuzz TZCNT encoding: accepted only as zero-guarded generic BSF alias"
            echo "ISA audit passed: ${{ steps.isa_audit.outputs.passed }}"
            echo "Vulkan: enabled"
            echo "OpenGL 3: enabled"
            echo "D3D12: disabled"
            echo "LTO: none"
            echo "C++ runtime: statically linked"
            echo "Compiler:"
            x86_64-w64-mingw32-g++ --version | head -n 1
            echo "SCons:"
            "$RUNNER_TEMP/scons-venv/bin/scons" --version | head -n 1
          } > dist/BUILD_INFO.txt
          cp "$RUNNER_TEMP/godot-sse2.patch" dist/SOURCE_PATCH.diff

      - name: Upload candidate for review (not yet the final release)
        id: upload_candidate
        if: always() && steps.package_candidate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Godot-4.5.1-Windows-x64-SSE2-CANDIDATE
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation gate
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          if [[ "${{ steps.pe_check.outcome }}" != "success" ]]; then
            echo "PE architecture/startup validation failed."
            exit 1
          fi
          if [[ "${{ steps.isa_audit.outputs.passed }}" != "true" ]]; then
            echo "ISA audit did not pass. Candidate artifact was retained for diagnosis."
            exit 1
          fi
          if [[ "${{ steps.upload_candidate.outcome }}" != "success" ]]; then
            echo "Candidate artifact upload failed."
            exit 1
          fi

  windows-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download build candidate
        uses: actions/download-artifact@v4
        with:
          name: Godot-4.5.1-Windows-x64-SSE2-CANDIDATE
          path: dist

      - name: Verify version and release command-line options
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = (Resolve-Path 'dist/Godot_v4.5.1-stable_windows_x86_64_SSE2.exe').Path
          $version = & $engine --version 2>&1 | Out-String
          Write-Host $version
          if ($version -notmatch '4\.5\.1') { throw "Unexpected engine version: $version" }
          $help = & $engine --help 2>&1 | Out-String
          if ($help -notmatch '--main-pack') { throw 'Release binary does not expose --main-pack.' }
          if ($help -notmatch '--audio-output-latency') { throw 'Release binary does not expose audio latency option.' }
          if ($help -notmatch '--max-fps') { throw 'Release binary does not expose FPS limit option.' }

      - name: Run a minimal headless project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = (Resolve-Path 'dist/Godot_v4.5.1-stable_windows_x86_64_SSE2.exe').Path
          New-Item -ItemType Directory -Force smoke | Out-Null
          @'
          config_version=5
          [application]
          config/name="Godot 4.5.1 SSE2 smoke test"
          run/main_scene="res://main.tscn"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          '@ | Set-Content smoke/project.godot -Encoding utf8
          @'
          [gd_scene format=3]
          [node name="Main" type="Node"]
          '@ | Set-Content smoke/main.tscn -Encoding utf8
          $log = Join-Path $PWD 'dist/smoke-test.log'
          & $engine --headless --path (Join-Path $PWD 'smoke') --quit-after 3 --log-file $log
          if ($LASTEXITCODE -ne 0) { throw "Headless smoke test failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $log)) { throw 'Godot did not create its smoke-test log.' }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'Godot Engine v4\.5\.1' -Quiet)) {
            throw 'Smoke-test log does not identify Godot 4.5.1.'
          }

      - name: Upload smoke-tested SSE2 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Godot-4.5.1-Windows-x64-SSE2
          path: dist/
          if-no-files-found: error
          retention-days: 30
