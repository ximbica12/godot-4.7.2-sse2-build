name: Build Godot 4.7.2 Windows x64 SSE2 ANGLE D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MinGW-w64 x64 SSE2 + source-built ANGLE (D3D11)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Checkout Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot
          fetch-depth: 1

      - name: Checkout ANGLE static source and submodules
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-angle-static
          ref: godot-static
          path: angle-static
          fetch-depth: 1
          submodules: false

      - name: Initialize only public ANGLE build dependencies
        run: |
          set -euo pipefail
          cd angle-static
          # Do not recurse into ANGLE's entire Chromium dependency tree:
          # it includes the private chrome-internal.googlesource.com/angle/es-cts submodule,
          # which is not needed by this static Godot ANGLE build.
          git submodule update --init --depth 1 angle third_party/astc-encoder/src third_party/zlib
          test -f angle/src/commit_id.py
          test -d third_party/astc-encoder/src/Source
          test -f third_party/zlib/zlib.h
          echo "Initialized only the three public submodules required by godot-angle-static."

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            python3 \
            python3-venv

      - name: Install SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons-venv"
          "$RUNNER_TEMP/scons-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/scons-venv/bin/python" -m pip install "scons==4.10.1"

      - name: Patch Godot and ANGLE to use the SSE2 baseline
        run: |
          python3 scripts/patch_sse2.py godot/SConstruct godot/platform/windows/SCsub
          python3 scripts/patch_angle_sse2.py angle-static/SConstruct

      - name: Generate ANGLE source headers
        run: |
          set -euo pipefail
          cd angle-static
          git submodule status angle third_party/astc-encoder/src third_party/zlib
          ./update_angle.sh

      - name: Build ANGLE static libraries for Windows x64 SSE2
        env:
          MINGW_PREFIX: /usr
        run: |
          set -euo pipefail
          cd angle-static
          "$RUNNER_TEMP/scons-venv/bin/scons" -j2 \
            platform=windows \
            arch=x86_64 \
            use_mingw=yes \
            use_llvm=no \
            use_static_cpp=yes
          test -f bin/libANGLE.windows.x86_64.a
          test -f bin/libEGL.windows.x86_64.a
          test -f bin/libGLES.windows.x86_64.a
          echo "ANGLE static libraries built with x86-64-v1 (SSE2)."

      - name: Audit ANGLE static libraries for post-SSE2 instructions
        run: |
          set -euo pipefail
          for lib in angle-static/bin/libANGLE.windows.x86_64.a angle-static/bin/libEGL.windows.x86_64.a angle-static/bin/libGLES.windows.x86_64.a; do
            echo "Checking $lib"
            python3 scripts/audit_sse2.py "$lib"
          done

      - name: Build Windows x64 release runtime with source-built ANGLE D3D11
        env:
          MINGW_PREFIX: /usr
        run: |
          cd godot
          "$RUNNER_TEMP/scons-venv/bin/scons" -j2 \
            platform=windows \
            arch=x86_64 \
            target=template_release \
            use_mingw=yes \
            use_llvm=no \
            use_static_cpp=yes \
            production=yes \
            lto=none \
            optimize=speed \
            disable_path_overrides=no \
            winrt=no \
            accesskit=no \
            d3d12=no \
            angle=yes \
            angle_libs="$GITHUB_WORKSPACE/angle-static/bin" \
            vulkan=yes \
            opengl3=yes

      - name: Verify executable, ANGLE backend and CPU instruction set
        run: |
          set -euo pipefail
          exe="godot/bin/godot.windows.template_release.x86_64.exe"
          test -f "$exe"
          mkdir -p dist
          x86_64-w64-mingw32-objdump -f "$exe" | tee dist/PE_INFO.txt
          grep -q "pei-x86-64" dist/PE_INFO.txt
          python3 scripts/audit_sse2.py "$exe"
          strings "$exe" | grep -Fq "Could not initialize ANGLE OpenGL."
          strings "$exe" | grep -Fq "opengl3_angle"
          echo "ANGLE D3D11 backend markers found."

      - name: Package build information
        run: |
          set -euo pipefail
          cp godot/bin/godot.windows.template_release.x86_64.exe \
            dist/Godot_v4.7.2-stable_windows_x86_64_SSE2_ANGLE_D3D11.exe
          {
            echo "Godot tag: 4.7.2-stable"
            echo "Godot source commit: $(git -C godot rev-parse HEAD)"
            echo "ANGLE source commit: $(git -C angle-static rev-parse HEAD)"
            echo "Target: Windows x86_64 template_release"
            echo "CPU baseline: x86-64-v1 (SSE2)"
            echo "Compatibility renderer backend: ANGLE / Direct3D 11"
            echo "ANGLE: built from source with x86-64-v1 flags"
            echo "Compiler:"
            x86_64-w64-mingw32-g++ --version | head -n 1
            echo "SCons:"
            "$RUNNER_TEMP/scons-venv/bin/scons" --version | head -n 1
            echo "LTO: none"
            echo "C++ runtime: statically linked"
          } > dist/BUILD_INFO.txt

      - name: Upload Windows x64 SSE2 ANGLE D3D11 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Godot-4.7.2-Windows-x64-SSE2-ANGLE-D3D11
          path: dist/
          if-no-files-found: error
          retention-days: 30
