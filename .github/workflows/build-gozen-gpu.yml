name: GoZen GPU First Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gozen-gpu.yml'
      - 'gozen/**'
permissions:
  contents: read
concurrency:
  group: gozen-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned GDE GoZen source
        uses: actions/checkout@v4
        with:
          repository: VoylinsGamedevJourney/gde_gozen
          ref: fa01fc6128f8a6d08162c2b5ee28501f45a44bc1
          path: upstream
          submodules: false
          fetch-depth: 1
      - name: Fetch only required public dependencies
        working-directory: upstream
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 ffmpeg godot_cpp libvpx libaom
          git submodule status
          test "$(git -C ffmpeg rev-parse HEAD)" = 5a1f107b4c78318f318897900acad1b6c6aa3f9d
          test "$(git -C godot_cpp rev-parse HEAD)" = b0e3b1e4b78a606f48d162898afb5eeda533d2a9
          test "$(git -C libvpx rev-parse HEAD)" = 3fce57ecc905d95a4619f33d09851d68c5a88663
          test "$(git -C libaom rev-parse HEAD)" = de575da20409b4e1fa477c5615837715999c905a
          test -f ffmpeg/configure
          test -f godot_cpp/SConstruct
          test -f libvpx/configure
          test -f libaom/CMakeLists.txt
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 cmake ninja-build nasm yasm pkg-config python3-venv ffmpeg
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/pip" install 'scons==4.10.1'
          echo "$RUNNER_TEMP/scons/bin" >> "$GITHUB_PATH"
          x86_64-w64-mingw32-g++ --version
      - name: Validate and apply source patch
        run: |
          python3 -m py_compile gozen/patch_gpu.py
          python3 gozen/patch_gpu.py upstream
          python3 -m py_compile upstream/build.py upstream/SConstruct
          # Static FFmpeg/libaom dependencies require MinGW's POSIX runtime at the end of the link line.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/SConstruct")
          s = p.read_text()
          old = 'LIBS=["ws2_32", "bcrypt", "secur32", "shlwapi", "mfuuid", "strmiids", "ole32", "user32", "uuid"],'
          assert s.count(old) == 1, "Unexpected Windows link configuration"
          p.write_text(s.replace(old, old.replace('"uuid"]', '"uuid", "winpthread"]'), 1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/src/gozen_video.cpp")
          s = p.read_text()
          old = "\tif (av_codec_ctx) {\n\t\tavcodec_flush_buffers(av_codec_ctx.get());\n\t}\n\n\tav_codec_ctx.reset();"
          new = "\t// avcodec_free_context handles both opened and unopened codecs.\n\t// Flushing a partially initialized codec can dereference a null internal state.\n\tav_codec_ctx.reset();"
          assert s.count(old) == 1, "Unexpected close() implementation"
          s = s.replace(old, new, 1)
          old = "\tavio_ctx.reset();\n\tfile_buffer.clear();"
          new = "\tavio_ctx.reset();\n\tfile_buffer.clear();\n\tav_stream = nullptr;\n\tusing_sws = false;\n\thas_alpha = false;\n"
          assert s.count(old) == 1, "Unexpected close() cleanup"
          s = s.replace(old, new, 1)
          old = "        if (!supported || av_hwdevice_ctx_create(&av_codec_ctx->hw_device_ctx, type, nullptr, nullptr, 0) < 0) {\n            close();\n            return ERR_UNAVAILABLE;\n        }"
          new = "        UtilityFunctions::print(hw_mode == 1 ? \"GoZen GPU: trying D3D11VA\" : \"GoZen GPU: trying DXVA2\");\n        int hw_error = supported ? av_hwdevice_ctx_create(&av_codec_ctx->hw_device_ctx, type, nullptr, nullptr, 0) : AVERROR(ENOSYS);\n        if (hw_error < 0) {\n            FFmpeg::print_av_error(\"GoZen GPU: device unavailable: \", hw_error);\n            close();\n            return ERR_UNAVAILABLE;\n        }"
          assert s.count(old) == 1, "Unexpected hardware device initialization"
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git -C upstream diff --check
          git -C upstream diff > "$RUNNER_TEMP/gozen-gpu.patch"
          printf '#include <windows.h>\n#include <d3d11.h>\n#include <d3d9.h>\n#include <dxva2api.h>\nint main(){return 0;}\n' > "$RUNNER_TEMP/preflight.cpp"
          x86_64-w64-mingw32-g++ -march=x86-64 "$RUNNER_TEMP/preflight.cpp" -static -lwinpthread -o "$RUNNER_TEMP/preflight.exe"
          lib="$(x86_64-w64-mingw32-g++ -print-file-name=libwinpthread.a)"
          test -f "$lib"
      - name: Compile FFmpeg with H264 hardware decoder preflight
        working-directory: upstream
        run: |
          python3 -c "import build; build.THREADS=2; build.compile_ffmpeg_windows('x86_64')"
          test -f ffmpeg/bin/lib/libavcodec.a
          grep -Fx '#define CONFIG_H264_D3D11VA2_HWACCEL 1' ffmpeg/config_components.h
          grep -Fx '#define CONFIG_H264_DXVA2_HWACCEL 1' ffmpeg/config_components.h
      - name: Compile release DLL
        working-directory: upstream
        env:
          MINGW_PREFIX: /usr
        run: |
          scons -j2 platform=windows arch=x86_64 target=template_release use_mingw=yes use_static_cpp=yes use_llvm=no lto=none optimize=speed
          test -s test_room/addons/gde_gozen/bin/libgozen.windows.template_release.x86_64.dll
      - name: Verify PE export and package candidate
        run: |
          set -euo pipefail
          mkdir -p candidate
          dll=upstream/test_room/addons/gde_gozen/bin/libgozen.windows.template_release.x86_64.dll
          x86_64-w64-mingw32-objdump -f "$dll" > candidate/PE_INFO.txt
          grep -F 'pei-x86-64' candidate/PE_INFO.txt
          x86_64-w64-mingw32-objdump -p "$dll" > candidate/IMPORTS_EXPORTS.txt
          grep -F 'gozen_library_init' candidate/IMPORTS_EXPORTS.txt
          strings "$dll" > "$RUNNER_TEMP/gozen.strings"
          grep -F 'GoZen GPU: D3D11VA decoded first frame' "$RUNNER_TEMP/gozen.strings"
          grep -F 'GoZen GPU: DXVA2 decoded first frame' "$RUNNER_TEMP/gozen.strings"
          grep -F 'GoZen GPU: software decoding' "$RUNNER_TEMP/gozen.strings"
          cp "$dll" candidate/
          cp "$RUNNER_TEMP/gozen-gpu.patch" candidate/SOURCE.patch
          cp upstream/LICENSE candidate/LICENSE-GOZEN.txt
          cp upstream/ffmpeg/COPYING.LGPLv2.1 candidate/LICENSE-FFMPEG.txt
          cp upstream/libvpx/LICENSE candidate/LICENSE-LIBVPX.txt
          cp upstream/libaom/LICENSE candidate/LICENSE-LIBAOM.txt
          git -C upstream submodule status > candidate/SOURCE_VERSIONS.txt
          git -C upstream rev-parse HEAD >> candidate/SOURCE_VERSIONS.txt
          (cd candidate && sha256sum *.dll > SHA256SUMS.txt)
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30 -t 2 -c:v libx264 -pix_fmt yuv420p -profile:v main -an -movflags +faststart candidate/test.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: GoZen-GPU-Candidate-NOT-VALIDATED
          path: candidate/
          if-no-files-found: error
          retention-days: 7
  windows-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Download candidate from this build
        uses: actions/download-artifact@v4
        with:
          name: GoZen-GPU-Candidate-NOT-VALIDATED
          path: candidate
      - name: Download official Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath editor
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
      - name: Test startup, extension loading, software and GPU-first decode separately
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = (Get-ChildItem editor -Recurse -File -Filter 'Godot_v4.7.2-stable_win64.exe' | Select-Object -First 1).FullName
          if (-not $engine) { throw 'Godot executable missing' }
          $project = Join-Path $PWD 'smoke'
          $diag = Join-Path $PWD 'diagnostics'
          New-Item -ItemType Directory -Path "$project/.godot" -Force | Out-Null
          Copy-Item candidate/libgozen.windows.template_release.x86_64.dll $project
          Copy-Item candidate/test.mp4 $project
          @'
          config_version=5
          [application]
          config/name="GoZen diagnostic"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          '@ | Set-Content "$project/project.godot" -Encoding utf8NoBOM
          @'
          [configuration]
          entry_symbol = "gozen_library_init"
          compatibility_minimum = "4.3"
          [libraries]
          windows.x86_64 = "res://libgozen.windows.template_release.x86_64.dll"
          '@ | Set-Content "$project/gozen.gdextension" -Encoding utf8NoBOM
          @'
          extends SceneTree
          func _initialize():
              call_deferred("run_test")
          func mark(message: String):
              print(message)
              var f = FileAccess.open("res://progress.txt", FileAccess.READ_WRITE if FileAccess.file_exists("res://progress.txt") else FileAccess.WRITE)
              if f:
                  f.seek_end()
                  f.store_line(message)
                  f.flush()
          func run_test():
              mark("SCRIPT_STARTED")
              var stage = OS.get_environment("GOZEN_SMOKE_STAGE")
              if stage == "startup":
                  mark("GOZEN_SMOKE_PASS")
                  quit(0)
                  return
              mark("LOADING_EXTENSION")
              if not ClassDB.class_exists("GoZenVideo"):
                  var status = GDExtensionManager.load_extension("res://gozen.gdextension")
                  mark("EXTENSION_LOAD_STATUS=" + str(status))
              if not ClassDB.class_exists("GoZenVideo"):
                  mark("EXTENSION_NOT_REGISTERED")
                  quit(1)
                  return
              mark("EXTENSION_REGISTERED")
              if stage == "load":
                  mark("GOZEN_SMOKE_PASS")
                  quit(0)
                  return
              var v = ClassDB.instantiate("GoZenVideo")
              mark("INSTANCE_CREATED")
              v.open("res://test.mp4")
              mark("OPEN_RETURNED")
              if not v.is_open():
                  quit(2)
                  return
              for i in range(12):
                  if not v.next_frame(false):
                      mark("FRAME_FAILED=" + str(i))
                      quit(3)
                      return
                  mark("FRAME_OK=" + str(i))
              var image = v.get_y_data()
              if image == null or image.get_width() != 320 or image.get_height() != 240:
                  mark("IMAGE_INVALID")
                  quit(4)
                  return
              v = null
              mark("GOZEN_SMOKE_PASS")
              quit(0)
          '@ | Set-Content "$project/smoke.gd" -Encoding utf8NoBOM
          $failed = @()
          foreach ($stage in @('startup','load','software','d3d11va','dxva2','gpu-first')) {
              Write-Host "===== START $stage ====="
              Remove-Item "$project/progress.txt" -ErrorAction SilentlyContinue
              $env:GOZEN_SMOKE_STAGE = $stage
              $env:GOZEN_HWDEC = switch ($stage) { 'gpu-first' { '1' }; 'd3d11va' { 'd3d11va' }; 'dxva2' { 'dxva2' }; default { '0' } }
              if ($stage -eq 'startup') {
                  Remove-Item "$project/.godot/extension_list.cfg" -ErrorAction SilentlyContinue
              } else {
                  'res://gozen.gdextension' | Set-Content "$project/.godot/extension_list.cfg" -Encoding utf8NoBOM
              }
              $stdout = Join-Path $diag "$stage.stdout.txt"
              $stderr = Join-Path $diag "$stage.stderr.txt"
              $log = Join-Path $diag "$stage.godot.log"
              $arguments = "--headless --verbose --path `"$project`" --log-file `"$log`" --script res://smoke.gd"
              $p = Start-Process -FilePath $engine -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $finished = $p.WaitForExit(60000)
              if (-not $finished) {
                  Write-Host "TIMEOUT: $stage"
                  $p.Kill()
                  [void]$p.WaitForExit(10000)
              }
              foreach ($file in @($stdout,$stderr,$log,"$project/progress.txt")) {
                  if (Test-Path $file) { Get-Content $file -Tail 120 }
              }
              $progress = "$project/progress.txt"
              $passed = $finished -and ($p.ExitCode -eq 0) -and (Test-Path $progress) -and (Select-String -Path $progress -SimpleMatch 'GOZEN_SMOKE_PASS' -Quiet)
              if (Test-Path $progress) { Copy-Item $progress "$diag/$stage.progress.txt" }
              if (-not $passed) { $failed += $stage }
              if ($stage -in @('d3d11va','dxva2','gpu-first')) {
                  $gpu = (Test-Path $log) -and (Select-String -Path $log -Pattern 'GoZen GPU: (D3D11VA|DXVA2) decoded first frame' -Quiet)
                  Write-Host "Hardware frame confirmed: $gpu (stage=$stage)"
                  "stage=$stage; hardware_frame=$gpu; smoke_pass=$passed" | Add-Content "$diag/backend-results.txt"
              }
              Write-Host "===== END $stage PASS=$passed ====="
          }
          if ($failed.Count -gt 0) { throw "Failed stages: $($failed -join ', ')" }
          Write-Host 'All smoke tests passed; physical GPU support still requires local test.'
          Copy-Item diagnostics/backend-results.txt candidate/
          Remove-Item candidate/test.mp4
      - name: Upload diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-Windows-Diagnostic-Logs
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish smoke-tested candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-GPU-First-Windows-x64-smoke-tested
          path: candidate/
          if-no-files-found: error
          retention-days: 30
